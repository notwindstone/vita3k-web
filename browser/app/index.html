<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0F1417">
  <script>
    // Select the saved palette before styles paint, including on slow phones.
    try {
      const scheme = JSON.parse(localStorage.getItem('vita3k.app.settings') || '{}')?.colorScheme;
      if (typeof scheme === 'string') document.documentElement.dataset.colorScheme = scheme;
    } catch {}
  </script>
  <meta name="description" content="Play PS Vita games in your browser: a web port of the Vita3K emulator.">
  <title>Vita3K Web</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23094C6B'/%3E%3Cpath d='M9 11h14a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4v-2a4 4 0 0 1 4-4z' fill='%23AFDAFB'/%3E%3Ccircle cx='10' cy='16' r='2' fill='%23094C6B'/%3E%3Ccircle cx='22' cy='16' r='2' fill='%23094C6B'/%3E%3C/svg%3E">
  <!-- Cross-origin isolation (the threaded runtime) on hosts that send no headers: before anything else. -->
  <script src="./coi.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
